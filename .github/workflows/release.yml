name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build .app
        run: make build

      - name: Package
        run: ditto -c -k --keepParent VoiceInput.app VoiceInput.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: VoiceInput.zip
          generate_release_notes: true
